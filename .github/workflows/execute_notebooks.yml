name: Execute Weekly Exercises

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week number to execute (e.g., 1, 2, 3)'
        required: true
        type: string
        default: '1'

jobs:
  run-exercises:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert google-genai google-adk langchain-google-genai langgraph python-dotenv

      - name: Execute Python Exercises
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          WEEK_DIR="Week${{ inputs.week }}"
          
          if [ ! -d "$WEEK_DIR" ]; then
            echo "Error: Directory $WEEK_DIR does not exist."
            exit 1
          fi
          
          echo "## Results for Week ${{ inputs.week }}" >> $GITHUB_STEP_SUMMARY
          
          # Find all python files named exercise*.py and execute them sequentially
          for file in $(ls $WEEK_DIR/exercise*.py 2>/dev/null | sort); do
            echo "Executing $file..."
            echo "### File: $file" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            python "$file" >> $GITHUB_STEP_SUMMARY 2>&1
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
          
          echo "Successfully executed python exercises!"
